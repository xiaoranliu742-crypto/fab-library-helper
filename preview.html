<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fab 免费素材助手 · 本地演示</title>
<style>body{margin:0;background:#101014;color:#eee;font:15px/1.6 system-ui}nav{padding:24px 40px;border-bottom:1px solid #ffffff0d;color:#c7c4d6}nav b{color:white;margin-right:36px}main{max-width:1150px;margin:70px auto;padding:24px}h1{font-size:36px;letter-spacing:-1px;margin-bottom:12px}.hint{color:#aaa4be}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}article{background:#202024;border:1px solid #303038;border-radius:14px;overflow:hidden}article a{display:block;color:#ddd;text-decoration:none}article .art{height:170px;display:grid;place-items:center;background:linear-gradient(135deg,#38312a,#1c2027);font-size:58px}article h3,article p{margin:12px 18px}article h3{font-size:14px}article p{font-size:12px;color:#b1acbd}.notice{border:1px solid #474255;padding:12px 18px;border-radius:12px;background:#24202d;color:#d1c7e4}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}main{margin-top:55px}}</style>
<nav><b>FAB HELPER</b><span translate="no" class="notranslate" lang="zh-CN">作者：菊山</span> · 本地交互演示</nav><main><h1>免费素材，一键入库。</h1><p class="hint">顶部面板可以拖动、收起、暂停，并导出处理结果。</p><p class="notice">此页使用虚构素材和本地模拟响应，所有“入库”都只是演示，不访问 Fab、不领取真实素材。真实扩展的安装文件在 extension 文件夹中。</p><section class="grid" id="grid"></section></main>
<script>
const demoAssets = [
 ['11111111-1111-4111-8111-111111111111','编织收纳篮','🧺','From Free',false,0],
 ['22222222-2222-4222-8222-222222222222','历史木碗','🥣','来自 免费',false,0],
 ['33333333-3333-4333-8333-333333333333','岩石扫描','🪨','Saved in My Library',true,0],
 ['44444444-4444-4444-8444-444444444444','陶制花瓶','🏺','From Free',false,0],
 ['55555555-5555-4555-8555-555555555555','付费授权示例','🌿','$19.99',false,19.99],
 ['66666666-6666-4666-8666-666666666666','木制物件','🪵','From Free',false,0]
];
document.getElementById('grid').innerHTML = demoAssets.map(a=>`<article><a href="https://www.fab.com/listings/${a[0]}" onclick="return false"><div class="art">${a[2]}</div><h3>${a[1]}</h3></a><p>${a[3]}</p></article>`).join('');
// Local fixture only, including when this preview is opened with file://.
Object.defineProperty(document, 'cookie', { configurable: true, get: () => 'fab_csrftoken=local-demo-only' });
document.addEventListener('click', e => {
 if(e.composedPath().some(n => n.tagName === 'A' && String(n.href).startsWith('https://www.fab.com/'))) e.preventDefault();
}, true);
window.chrome = { runtime: { id: 'preview-only', onMessage: { addListener() {} } }, storage: {local: {get: async()=>({}),set:async()=>{}}} };
window.fetch = async (url, init={}) => {
 if(url === '/i/users/me') return {ok:true,status:200,text:async()=>JSON.stringify({uid:'local-preview'})};
 const id = url.match(/[0-9a-f]{8}-[0-9a-f-]{27,}/)?.[0];
 const asset = demoAssets.find(a=>a[0]===id);
 if(!asset) throw new Error('仅支持本地演示素材');
 await new Promise(r=>setTimeout(r,250));
 let body;
 if(url.includes('listings-states')) body={acquired:asset[4]};
 else if(url.endsWith('/prices-infos')) body={offers:[{offerId:asset[0],price:asset[5]}]};
 else if(init.method==='POST'){ asset[4]=true;body=null; }
 else body={title:asset[1],licenses:[{slug:'professional',offerId:asset[0]}]};
 return {ok:true,status:200,text:async()=>JSON.stringify(body)};
};
</script><script src="extension/core.js"></script><script src="extension/content.js"></script></html>
